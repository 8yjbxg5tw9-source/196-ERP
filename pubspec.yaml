name: finai_studio
description: Enterprise-grade AI financial and accounting platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # State management and value equality.
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency injection.
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking and connectivity.
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # Functional error handling.
  dartz: ^0.10.1

  # Bank statement import formats.
  csv: ^8.0.0
  excel: ^4.0.6

  # Presentation and typography.
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  flutter_markdown: ^0.7.7+1

  # Financial report generation.
  pdf: ^3.11.3
  printing: ^5.13.4

  # Interactive executive dashboard charts.
  fl_chart: ^0.69.0

  # Official tax declaration XML serialization.
  xml: ^6.5.0

  # Local password hashing (PBKDF2-HMAC-SHA256).
  crypto: ^3.0.6

  # Encrypted backup archives (ZIP compression + AES-256-GCM).
  archive: ^3.6.1
  encrypt: ^5.0.3

  # Desktop document ingestion.
  file_picker: ^10.3.3
  desktop_drop: ^0.8.4

  # Desktop PDF verification viewer.
  pdfx: ^2.11.0

  # Local persistence and secure credentials.
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Desktop window lifecycle, sizing, and custom title bars.
  window_manager: ^0.5.2

  # Windows system tray and desktop toast notifications.
  system_tray: ^2.0.3

  # Global keyboard shortcuts.
  hotkey_manager: ^0.2.3
  local_notifier: ^0.1.6

  # Local relational storage and cross-platform database paths.
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6

  # Locale-aware number and date formatting.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Windows MSIX installer packaging.
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# Enterprise Windows installer branding, protocol handler, and file
# association bindings (Step 40). Build with `dart run msix:create`.
msix_config:
  display_name: FinAI Studio
  publisher_display_name: FinAI Studio Systems LLC
  identity_name: com.finaistudio.desktop
  msix_version: 1.0.0.0
  logo_path: assets/icons/app_logo.png
  capabilities: internetClient, runFullTrust
  file_extension: .finai
  protocol_activation: finai
